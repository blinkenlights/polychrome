# Octopus — gravity (Raspberry Pi) deployment
#
# Three services share network_mode: host so that:
#   - UDP broadcast to ESP32 panels works (no Docker NAT)
#   - Caddy can reach both app instances at localhost:4000 / localhost:4001
#
# TLS is provided by Caddy using Tailscale certificates.
# See README.md for one-time setup steps.
#
# Two Octopus instances run from the same image, differentiated by env vars:
#   polychrome-woodstock  — Installation Woodstock, Boot App Fire, port 4000
#   polychrome-pixie      — Installation Pixie, Boot App PixelFun3d (Seegras), port 4001
#
# Caddy exposes both via HTTPS on the same hostname but different ports:
#   https://gravity.crested-frog.ts.net       → Pixie (port 4001)
#   https://gravity.crested-frog.ts.net:8443  → Woodstock (port 4000)

services:
  caddy:
    image: caddy:2-alpine
    network_mode: host
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /var/lib/tailscale/certs:/certs:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped

  polychrome-woodstock:
    image: polychrome:latest
    network_mode: host
    env_file: .env
    environment:
      PORT: "4000"
      INSTALLATION_MODULE: Octopus.Installation.Woodstock
      DATABASE_PATH: /data/woodstock.db
      PHX_URL_PORT: "8443"
      PHX_URL_SCHEME: https
      OSC_SERVER_ENABLED: "false"
      # Disable Erlang distribution — not needed for standalone nodes.
      RELEASE_DISTRIBUTION: none
    # dialout group is required to open /dev/ttyACM* devices.
    group_add:
      - dialout
    # Allow any ttyACM serial port (major 166) without listing each device at
    # container create time — USB may be unplugged on start or hot-plugged later.
    device_cgroup_rules:
      - 'c 166:* rmw'
    # SYS_ADMIN is required to write to /sys/bus/usb/devices/*/authorized,
    # which is how Radar.reset_adapter/1 power-cycles a USB adapter without
    # a physical unplug. Remove if USB reset is not needed.
    cap_add:
      - SYS_ADMIN
    volumes:
      - ./data:/data
      # Live host /dev so udev-created ttyACM nodes appear after hot-plug.
      - /dev:/dev
      # Stable /dev/serial/by-id/… paths (read-only; targets live under /dev).
      - /dev/serial:/dev/serial:ro
      # Expose host sysfs so USB adapter authorized files can be written.
      - /sys/bus/usb:/sys/bus/usb
      - /sys/devices:/sys/devices
      # Host Avahi for NSS *.local lookups (libnss-mdns in the image).
      - /var/run/avahi-daemon/socket:/var/run/avahi-daemon/socket
    restart: unless-stopped

  polychrome-pixie:
    image: polychrome:latest
    network_mode: host
    env_file: .env
    environment:
      PORT: "4001"
      INSTALLATION_MODULE: Octopus.Installation.Pixie
      BOOT_APP: PixelFun3d
      BOOT_APP_MODE: seegras
      DATABASE_PATH: /data/pixie.db
      PHX_URL_PORT: "443"
      PHX_URL_SCHEME: https
      SECRET_KEY_BASE: ${PIXIE_SECRET_KEY_BASE}
      OSC_SERVER_ENABLED: "false"
      # Disable Erlang distribution — not needed for standalone nodes.
      RELEASE_DISTRIBUTION: none
    group_add:
      - dialout
    device_cgroup_rules:
      - 'c 166:* rmw'
    cap_add:
      - SYS_ADMIN
    volumes:
      - ./data:/data
      - /dev:/dev
      - /dev/serial:/dev/serial:ro
      - /sys/bus/usb:/sys/bus/usb
      - /sys/devices:/sys/devices
      - /var/run/avahi-daemon/socket:/var/run/avahi-daemon/socket
    restart: unless-stopped

volumes:
  caddy-data:
  caddy-config:
