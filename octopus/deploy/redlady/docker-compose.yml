# Octopus — redlady (Raspberry Pi) deployment
#
# Both services use network_mode: host so that:
#   - UDP broadcast to ESP32 panels works (no Docker NAT)
#   - Caddy can reach the app at localhost:4000
#
# TLS is provided by Caddy using Tailscale certificates.
# See README.md for one-time setup steps.

services:
  caddy:
    image: caddy:2-alpine
    network_mode: host
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /var/lib/tailscale/certs:/certs:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped

  polychrome:
    image: polychrome:latest
    network_mode: host
    env_file: .env
    # dialout group is required to open /dev/ttyACM* devices.
    group_add:
      - dialout
    # Expose all USB-to-serial adapters to the container.
    # ttyACM numbering is stable for fixed hardware (assigned by USB port order).
    devices:
      - /dev/ttyACM0
      - /dev/ttyACM1
      - /dev/ttyACM2
      - /dev/ttyACM3
      - /dev/ttyACM4
      - /dev/ttyACM5
      - /dev/ttyACM6
      - /dev/ttyACM7
    volumes:
      - ./data:/data
      # Bind-mount the udev symlink tree so /dev/serial/by-id/… paths resolve
      # to the device files above.
      - /dev/serial:/dev/serial:ro
    restart: unless-stopped

volumes:
  caddy-data:
  caddy-config:
